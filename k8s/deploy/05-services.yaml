# ─────────────────────────────────────────────────────────────────────────────
# Product Service — Java 17 / Spring Boot (port 8081)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: zylkerkart
  labels:
    app: product-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        tier: backend
    spec:
      enableServiceLinks: false
      containers:
        - name: product-service
          image: impazhani/product-service:chaos
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/db_product?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: MYSQL_ROOT_PASSWORD
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            # --- Chaos SDK ---
            - name: CHAOS_SDK_ENABLED
              value: "true"
            - name: CHAOS_SDK_APP_NAME
              value: "product-service"
            - name: CHAOS_SDK_CONFIG_DIR
              value: "/var/site24x7-labs/faults"
          volumeMounts:
            - name: chaos-config
              mountPath: /var/site24x7-labs/faults
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: chaos-config
          hostPath:
            path: /var/site24x7-labs/faults
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: zylkerkart
spec:
  selector:
    app: product-service
  ports:
    - port: 8081
      targetPort: 8081
---
