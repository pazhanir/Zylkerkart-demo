# ─────────────────────────────────────────────────────────────────────────────
# Auth Service — C# / .NET 8 (port 8085)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: zylkerkart
  labels:
    app: auth-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: backend
    spec:
      # Require amd64 node: .NET CLR profiler is x86_64 only
      nodeSelector:
        kubernetes.io/arch: amd64
      enableServiceLinks: false
      containers:
        - name: auth-service
          image: impazhani/auth-service:chaos
          ports:
            - containerPort: 8085
          env:
            - name: PORT
              value: "8085"
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: MYSQL_ROOT_PASSWORD
            - name: DB_NAME
              value: "db_auth"
            - name: JWT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: JWT_SECRET
            - name: JWT_EXPIRY_MINUTES
              value: "15"
            - name: JWT_REFRESH_EXPIRY_DAYS
              value: "7"
            # --- Chaos SDK ---
            - name: CHAOS_SDK_ENABLED
              value: "true"
            - name: CHAOS_SDK_APP_NAME
              value: "auth-service"
            - name: CHAOS_SDK_CONFIG_DIR
              value: "/var/site24x7-labs/faults"
          volumeMounts:
            - name: chaos-config
              mountPath: /var/site24x7-labs/faults
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
      volumes:
        - name: chaos-config
          hostPath:
            path: /var/site24x7-labs/faults
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: zylkerkart
spec:
  selector:
    app: auth-service
  ports:
    - port: 8085
      targetPort: 8085
