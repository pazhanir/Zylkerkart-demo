# ─────────────────────────────────────────────────────────────────────────────
# Storefront BFF — Java 17 / Spring Boot 3.2 (port 80)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: zylkerkart
  labels:
    app: storefront
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
        tier: frontend
    spec:
      enableServiceLinks: false
      containers:
        - name: storefront
          image: impazhani/storefront:chaos
          ports:
            - containerPort: 80
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: REDIS_PORT
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: PRODUCT_SERVICE_URL
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: ORDER_SERVICE_URL
            - name: SEARCH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: SEARCH_SERVICE_URL
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: PAYMENT_SERVICE_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: AUTH_SERVICE_URL
            # --- Chaos SDK ---
            - name: CHAOS_SDK_ENABLED
              value: "true"
            - name: CHAOS_SDK_APP_NAME
              value: "storefront"
            - name: CHAOS_SDK_CONFIG_DIR
              value: "/var/site24x7-labs/faults"
          volumeMounts:
            - name: chaos-config
              mountPath: /var/site24x7-labs/faults
          startupProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "400m"
      volumes:
        - name: chaos-config
          hostPath:
            path: /var/site24x7-labs/faults
            type: DirectoryOrCreate
---
# ClusterIP service for internal reference
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: zylkerkart
spec:
  selector:
    app: storefront
  ports:
    - port: 80
      targetPort: 80
---
# LoadBalancer service for external access
apiVersion: v1
kind: Service
metadata:
  name: storefront-lb
  namespace: zylkerkart
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "classic"
spec:
  type: LoadBalancer
  selector:
    app: storefront
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
