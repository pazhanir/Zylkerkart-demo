# ─────────────────────────────────────────────────────────────────────────────
# Storefront BFF — PHP 8.2 / Laravel 10 (port 80)
# With Site24x7 APM Insight PHP agent via InitContainers
# Ref: https://www.site24x7.com/help/apm/php-agent/add-php-agent-in-kubernetes-via-initcontainers.html
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: zylkerkart
  labels:
    app: storefront
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
        tier: frontend
    spec:
      # ── Shared volume for APM agent binaries ──
      volumes:
        - name: apminsight-volume
          emptyDir: {}

      # ── Init Container: download & extract PHP APM agent ──
      initContainers:
        - name: init-apminsight
          image: site24x7/apminsight-phpagent:latest
          imagePullPolicy: Always
          command:
            ["unzip", "/opt/apminsight.zip", "-d", "/opt"]
          volumeMounts:
            - name: apminsight-volume
              mountPath: /opt/apminsight

      containers:
        - name: storefront
          image: zylkerkart/storefront:latest
          ports:
            - containerPort: 80

          # ── Lifecycle: install APM agent + reload Apache ──
          lifecycle:
            postStart:
              exec:
                command:
                  - "/bin/sh"
                  - "-c"
                  - "chmod +x /apm/DockerInstallAgentPHP.sh && /apm/DockerInstallAgentPHP.sh && kill -USR1 1"

          env:
            # ── App Config ──
            - name: APP_NAME
              value: "ZylkerKart"
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "true"
            - name: APP_URL
              value: "http://zylkerkart.local"
            # ── Site24x7 APM Config ──
            - name: S247_LICENSE_KEY
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: S247_LICENSE_KEY
            - name: ZPA_APPLICATION_NAME
              value: "ZylkerKart-Storefront"
            # ── Service URLs ──
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: PRODUCT_SERVICE_URL
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: ORDER_SERVICE_URL
            - name: SEARCH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: SEARCH_SERVICE_URL
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: PAYMENT_SERVICE_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: zylkerkart-config
                  key: AUTH_SERVICE_URL

          # ── Mount APM agent volume ──
          volumeMounts:
            - name: apminsight-volume
              mountPath: /apm

          # startupProbe gates readiness/liveness until postStart APM install finishes
          startupProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: zylkerkart
spec:
  selector:
    app: storefront
  ports:
    - port: 80
      targetPort: 80
---
# ─────────────────────────────────────────────────────────────────────────────
# Chaos Dashboard — RBAC (ServiceAccount, ClusterRole, ClusterRoleBinding)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-dashboard-sa
  namespace: zylkerkart
  labels:
    app: chaos-dashboard
    tier: tools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-dashboard-role
  labels:
    app: chaos-dashboard
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-dashboard-binding
  labels:
    app: chaos-dashboard
subjects:
  - kind: ServiceAccount
    name: chaos-dashboard-sa
    namespace: zylkerkart
roleRef:
  kind: ClusterRole
  name: chaos-dashboard-role
  apiGroup: rbac.authorization.k8s.io
---
